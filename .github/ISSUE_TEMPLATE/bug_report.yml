name: Bug 报告 / Bug report
description: 报告一个问题 / Report something that is not working
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请去掉日志中的路径、密钥等敏感信息。
        Thanks! Please remove secrets and private paths from logs before submitting.
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 实际结果与期望结果 / Actual vs. expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 在公司电脑执行 workroam push --release
        2. 在家里电脑执行 workroam pull --acquire
        3. ...
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: 接力方向 / Handoff direction
      options:
        - Windows → macOS
        - macOS → Windows
        - Windows → Linux
        - Linux → Windows
        - macOS → Linux
        - Linux → macOS
        - 同一系统 / Same OS
        - 不涉及 / Not applicable
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      placeholder: workroam --version
  - type: input
    id: storage
    attributes:
      label: 存储 / Storage
      placeholder: RustFS / Garage / SeaweedFS / AWS S3 / R2 / OSS ...
  - type: input
    id: agents
    attributes:
      label: 涉及的 Agent / Agents involved
      placeholder: Claude Code 2.x, Codex ...
  - type: textarea
    id: logs
    attributes:
      label: 日志与 workroam status 输出 / Logs and workroam status output
      render: text
