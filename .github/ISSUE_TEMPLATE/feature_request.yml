name: 功能建议 / Feature request
description: 提出新功能或改进 / Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 在什么场景下遇到了什么不便？/ What situation is painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案 / Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案 / Alternatives considered
  - type: input
    id: related
    attributes:
      label: 相关需求编号 / Related requirement IDs
      description: 例如 PUSH-02、D-06（见 docs/prd.md）/ e.g. PUSH-02, D-06
