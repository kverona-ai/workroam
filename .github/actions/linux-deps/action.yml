name: Linux build dependencies
description: 安装桌面应用（Tauri v2 / WebKitGTK）与系统密钥库所需的开发库
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config file patchelf \
          libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev \
          libxdo-dev libssl-dev libdbus-1-dev
