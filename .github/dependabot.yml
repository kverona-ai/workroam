version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directories:
      - /
      # 桌面应用是独立的 Cargo workspace，有自己的 Cargo.lock
      - /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # 桌面前端没有 package.json（纯静态 apps/desktop/ui），不需要 npm
