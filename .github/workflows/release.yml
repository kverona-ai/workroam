name: Release

# 推送 v* tag 时构建全部平台的安装包并发布 GitHub Release：
#   git tag -s v0.1.0 -m "Workroam v0.1.0" && git push origin v0.1.0
# 手动运行（Actions → Release → Run workflow）：
#   tag 留空：只构建，不发布，产物在本次运行的 Artifacts 中（用于发布前演练）
#   tag 填写已存在的 tag：重新构建并发布或更新该版本
#   tag 填写尚不存在的 tag：在所选分支的最新提交上创建该 tag 后发布（无法推送 tag 时使用）
# 步骤见 docs/release.md；签名需要配置的 secrets 见 docs/signing.md。

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（如 v0.1.0）；留空只构建不发布
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  WORKROAM_NO_BANNER: 1

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write # 手动发布时创建 tag
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      signpath: ${{ steps.signing.outputs.signpath }}
      apple: ${{ steps.signing.outputs.apple }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"; ref="refs/tags/$tag"; publish=true
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"; ref="refs/tags/$tag"; publish=true
            case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::tag 应形如 v0.1.0"; exit 1 ;; esac
            if ! git rev-parse -q --verify "$ref" >/dev/null; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git tag -a "$tag" -m "Workroam $tag" "$GITHUB_SHA"
              git push origin "$ref"
              echo "::notice::已在 ${GITHUB_REF_NAME}（${GITHUB_SHA::7}）上创建 tag $tag"
            fi
            git checkout -q "$ref"
          else
            tag=""; ref="$GITHUB_SHA"; publish=false
          fi

          [ -f Cargo.toml ] || { echo "::error::仓库根目录没有 Cargo.toml，产品代码合入后才能发布"; exit 1; }
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "workroam-cli")][0].version // .packages[0].version')"

          if [ -n "$tag" ]; then
            version="${tag#v}"
            if [ "$version" != "$crate_version" ]; then
              echo "::error::tag $tag 与 Cargo 版本 $crate_version 不一致，请先修改 [workspace.package] version"
              exit 1
            fi
          else
            version="$crate_version"
          fi

          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "ref=$ref"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Signing status
        id: signing
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
          APPLE_API: ${{ secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_PRIVATE_KEY != '' }}
          APPLE_IDPW: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
          GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: |
          yes_no() { if [ "$1" = true ]; then echo "✅ $2"; else echo "— $3"; fi; }
          if [ "$APPLE_API" = true ]; then notary="✅ App Store Connect API 密钥"
          elif [ "$APPLE_IDPW" = true ]; then notary="✅ Apple ID + App 专用密码"
          else notary="— 未配置，不公证"; fi
          {
            echo "### 签名状态"
            echo
            echo "| 平台 | 状态 |"
            echo "| --- | --- |"
            echo "| macOS 签名 | $(yes_no "$APPLE_CERT" "Developer ID" "未配置，ad-hoc 签名") |"
            echo "| macOS 公证 | $notary |"
            echo "| Windows | $(yes_no "$SIGNPATH" "SignPath" "未配置，不签名") |"
            echo "| Linux（SHA256SUMS） | $(yes_no "$GPG" "GPG" "未配置，只有校验和与构建来源证明") |"
            echo
            echo "说明见 [docs/signing.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/signing.md)。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "signpath=$SIGNPATH" >> "$GITHUB_OUTPUT"
          echo "apple=$APPLE_CERT" >> "$GITHUB_OUTPUT"

  binaries:
    name: CLI · ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # 命令行与后台服务；Linux 用 glibc（Ubuntu 22.04，glibc 2.35）
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, cli: true, server: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, cli: true, server: false }
          # workroam-server 在 Linux 上是 musl 静态二进制（架构 §18.1），同时产出容器镜像用的完整模式
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, cli: false, server: true, docker: amd64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm, cli: false, server: true, docker: arm64 }
          - { target: aarch64-apple-darwin, os: macos-14, cli: true, server: true }
          - { target: x86_64-apple-darwin, os: macos-14, cli: true, server: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cli: true, server: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, cli: true, server: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev musl-tools

      - name: Build
        run: |
          bins=()
          [ "${{ matrix.cli }}" = true ] && bins+=(--bin workroam --bin workroamd)
          [ "${{ matrix.server }}" = true ] && bins+=(--bin workroam-server)
          cargo build --release --locked --target "$TARGET" "${bins[@]}"

      - name: Sign macOS binaries
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          fi
          files=()
          [ "${{ matrix.cli }}" = true ] && files+=("target/$TARGET/release/workroam" "target/$TARGET/release/workroamd")
          [ "${{ matrix.server }}" = true ] && files+=("target/$TARGET/release/workroam-server")
          scripts/release/macos-sign.sh binaries "${files[@]}"
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Windows 二进制先上传，由 windows-sign 任务统一交给 SignPath 签名后再打包
      - name: Stage Windows binaries
        if: runner.os == 'Windows'
        run: |
          mkdir -p "winbin/$TARGET"
          for bin in workroam workroamd workroam-server; do
            [ -f "target/$TARGET/release/$bin.exe" ] && cp "target/$TARGET/release/$bin.exe" "winbin/$TARGET/"
          done
          ls -l "winbin/$TARGET"
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: winbin-cli-${{ matrix.target }}
          path: winbin/*
          if-no-files-found: error

      - name: Package
        if: runner.os != 'Windows'
        run: |
          [ "${{ matrix.cli }}" = true ] && scripts/release/package-bins.sh workroam "$VERSION" "$TARGET" dist workroam workroamd
          [ "${{ matrix.server }}" = true ] && scripts/release/package-bins.sh workroam-server "$VERSION" "$TARGET" dist workroam-server
          ls -l dist

      - name: Smoke test
        if: "!startsWith(matrix.target, 'aarch64-pc-windows') && !(runner.arch == 'ARM64' && startsWith(matrix.target, 'x86_64'))"
        run: |
          case "$TARGET" in *windows*) exe=.exe ;; *) exe= ;; esac
          dir="target/$TARGET/release"
          [ "${{ matrix.cli }}" = true ] && "$dir/workroam$exe" --version
          [ "${{ matrix.server }}" = true ] && "$dir/workroam-server$exe" --version
          true

      - name: Container binary (full mode)
        if: matrix.docker
        run: |
          has_full="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "workroam-server")][0].features | has("full")')"
          if [ "$has_full" = true ]; then
            cargo build --release --locked --target "$TARGET" --bin workroam-server --features workroam-server/full
          fi
          mkdir -p "dist-container/${{ matrix.docker }}"
          cp "target/$TARGET/release/workroam-server" "dist-container/${{ matrix.docker }}/"

      - uses: actions/upload-artifact@v7
        if: runner.os != 'Windows'
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.docker
        with:
          name: container-${{ matrix.docker }}
          path: dist-container/*
          if-no-files-found: error

  desktop:
    name: Desktop · ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, arch: arm64, os: macos-14, target: aarch64-apple-darwin, bundles: 'app,dmg' }
          - { platform: macos, arch: x64, os: macos-14, target: x86_64-apple-darwin, bundles: 'app,dmg' }
          - { platform: windows, arch: x64, os: windows-latest, target: x86_64-pc-windows-msvc, bundles: 'msi,nsis' }
          # WiX 不支持 ARM64，Windows arm64 只出 NSIS 安装程序
          - { platform: windows, arch: arm64, os: windows-latest, target: aarch64-pc-windows-msvc, bundles: 'nsis' }
          - { platform: linux, arch: x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'deb,rpm,appimage' }
          - { platform: linux, arch: arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundles: 'deb,rpm,appimage' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      APPIMAGE_EXTRACT_AND_RUN: 1
      # src-tauri 不在根 workspace 里，统一用根目录的 target，collect-desktop.sh 从这里找安装包
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Check desktop app
        run: |
          [ -f apps/desktop/src-tauri/tauri.conf.json ] || { echo "::error::没有 apps/desktop/src-tauri/tauri.conf.json"; exit 1; }
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> ../../../target
      - uses: ./.github/actions/desktop-prepare
        with:
          target: ${{ matrix.target }}
          sidecars: build

      - name: Build
        working-directory: apps/desktop
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          SECRET_APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          # 只导出已配置的 secret：Tauri 看到空的 APPLE_CERTIFICATE 也会尝试导入证书
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_API_KEY APPLE_API_ISSUER APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="$(printenv "SECRET_$name" || true)"
            [ -n "$value" ] && export "$name=$value"
          done
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          fi

          # 没有证书时 macOS 用 ad-hoc 签名（arm64 必须有签名才能运行）
          override='{}'
          if [ "${{ matrix.platform }}" = macos ] && [ -z "${APPLE_CERTIFICATE:-}" ]; then
            override='{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          fi
          echo "$override" > "$RUNNER_TEMP/tauri.release.json"

          if [ "${{ matrix.platform }}" = windows ]; then
            # Windows 只编译：exe 交给 SignPath 签名后，再由 windows-bundle 任务打安装包
            npx --yes @tauri-apps/cli@^2.12 build --target "$TARGET" --no-bundle --ci
          else
            npx --yes @tauri-apps/cli@^2.12 build \
              --target "$TARGET" \
              --bundles "${{ matrix.bundles }}" \
              --config "$RUNNER_TEMP/tauri.release.json" \
              --ci
          fi

      - name: Notarize dmg and verify
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_API_PRIVATE_KEY" ]; then
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          fi
          bundle="$CARGO_TARGET_DIR/$TARGET/release/bundle"
          for app in "$bundle"/macos/*.app; do scripts/release/macos-sign.sh verify-app "$app"; done
          for dmg in "$bundle"/dmg/*.dmg; do scripts/release/macos-sign.sh dmg "$dmg"; done
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Stage Windows executables
        if: matrix.platform == 'windows'
        run: |
          out="winbin/desktop-$TARGET"
          mkdir -p "$out"
          cp "$CARGO_TARGET_DIR/$TARGET/release/workroam-desktop.exe" "$out/"
          # 随附二进制（bundle.externalBin），按原名保存，打包时再放回 src-tauri/binaries
          for ext in $(jq -r '.bundle.externalBin // [] | .[]' apps/desktop/src-tauri/tauri.conf.json | tr -d '\r'); do
            cp "apps/desktop/src-tauri/$ext-$TARGET.exe" "$out/$(basename "$ext").exe"
          done
          ls -l "$out"
      - uses: actions/upload-artifact@v7
        if: matrix.platform == 'windows'
        with:
          name: winbin-desktop-${{ matrix.target }}
          path: winbin/*
          if-no-files-found: error

      - name: Collect
        if: matrix.platform != 'windows'
        run: scripts/release/collect-desktop.sh "$VERSION" "$TARGET" "${{ matrix.platform }}" "${{ matrix.arch }}" dist

      - uses: actions/upload-artifact@v7
        if: matrix.platform != 'windows'
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Windows 签名分两步，各提交一次 SignPath 签名请求：
  #   1. windows-sign：命令行、服务端与桌面应用的 exe（含随附二进制）
  #   2. windows-installers：用签好名的 exe 打出的 .msi 与 -setup.exe
  # 没有配置 SignPath 时照常走这几个任务，只是原样传递文件。
  windows-sign:
    name: Windows · sign executables
    needs: [prepare, binaries, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: unsigned
          pattern: winbin-*
          merge-multiple: true
      - id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-executables
          path: unsigned/*
          if-no-files-found: error
      - name: Sign with SignPath
        if: needs.prepare.outputs.signpath == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'workroam' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # SignPath Foundation 的发布签名需要在 SignPath 网页上人工批准
          wait-for-completion-timeout-in-seconds: ${{ vars.SIGNPATH_WAIT_SECONDS || '7200' }}
          output-artifact-directory: signed
      - name: Without SignPath
        if: needs.prepare.outputs.signpath != 'true'
        run: |
          echo "::notice::未配置 SignPath（SIGNPATH_API_TOKEN 与 SIGNPATH_ORGANIZATION_ID），Windows 文件不签名"
          cp -R unsigned signed
      - name: Verify signatures
        if: needs.prepare.outputs.signpath == 'true'
        run: scripts/release/windows-verify.sh signed
      - uses: actions/upload-artifact@v7
        with:
          name: windows-executables
          path: signed/*
          if-no-files-found: error

  windows-bundle:
    name: Windows · installers ${{ matrix.arch }}
    needs: [prepare, windows-sign]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc, bundles: 'msi,nsis' }
          # WiX 不支持 ARM64，Windows arm64 只出 NSIS 安装程序
          - { arch: arm64, target: aarch64-pc-windows-msvc, bundles: 'nsis' }
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # 只构建前端并放占位的随附二进制，真正的 exe 来自 windows-sign
      - uses: ./.github/actions/desktop-prepare
        with:
          target: ${{ matrix.target }}
          sidecars: placeholder
      - uses: actions/download-artifact@v8
        with:
          name: windows-executables
          path: signed
      - name: Place signed executables
        run: |
          src="signed/desktop-$TARGET"
          mkdir -p "$CARGO_TARGET_DIR/$TARGET/release"
          cp "$src/workroam-desktop.exe" "$CARGO_TARGET_DIR/$TARGET/release/"
          for ext in $(jq -r '.bundle.externalBin // [] | .[]' apps/desktop/src-tauri/tauri.conf.json | tr -d '\r'); do
            cp "$src/$(basename "$ext").exe" "apps/desktop/src-tauri/$ext-$TARGET.exe"
          done
      - name: Bundle
        working-directory: apps/desktop
        # --no-binary-patching：不改写主程序，保留它的签名（只有自动更新需要这个补丁）
        run: |
          npx --yes @tauri-apps/cli@^2.12 bundle \
            --target "$TARGET" \
            --bundles "${{ matrix.bundles }}" \
            --no-binary-patching \
            --ci
      - name: Collect
        run: scripts/release/collect-desktop.sh "$VERSION" "$TARGET" windows "${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@v7
        with:
          name: wininst-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows-installers:
    name: Windows · sign installers
    needs: [prepare, windows-sign, windows-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: unsigned
          pattern: wininst-*
          merge-multiple: true
      - id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-installers
          path: unsigned/*
          if-no-files-found: error
      - name: Sign with SignPath
        if: needs.prepare.outputs.signpath == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'workroam' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # SignPath Foundation 的发布签名需要在 SignPath 网页上人工批准
          wait-for-completion-timeout-in-seconds: ${{ vars.SIGNPATH_WAIT_SECONDS || '7200' }}
          output-artifact-directory: installers
      - name: Without SignPath
        if: needs.prepare.outputs.signpath != 'true'
        run: |
          echo "::notice::未配置 SignPath（SIGNPATH_API_TOKEN 与 SIGNPATH_ORGANIZATION_ID），Windows 文件不签名"
          cp -R unsigned installers
      - uses: actions/download-artifact@v8
        with:
          name: windows-executables
          path: exes
      - name: Package CLI
        run: |
          for target in x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            mkdir -p "target/$target/release"
            cp "exes/$target/"*.exe "target/$target/release/"
            scripts/release/package-bins.sh workroam "$VERSION" "$target" dist-bin workroam workroamd
            scripts/release/package-bins.sh workroam-server "$VERSION" "$target" dist-bin workroam-server
          done
      - name: Verify signatures
        if: needs.prepare.outputs.signpath == 'true'
        run: scripts/release/windows-verify.sh installers target
      - uses: actions/upload-artifact@v7
        with:
          name: bin-windows
          path: dist-bin/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: installers/*
          if-no-files-found: error

  source:
    name: Source archives
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/release/source.sh "${{ needs.prepare.outputs.version }}" HEAD dist
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/*
          if-no-files-found: error

  assemble:
    name: Assemble release
    needs: [prepare, binaries, desktop, source, windows-installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '{bin,desktop}-*'
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: dist
          name: source

      - name: Install scripts, manifests, checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SIGNED_WINDOWS: ${{ needs.prepare.outputs.signpath }}
          SIGNED_MACOS: ${{ needs.prepare.outputs.apple }}
        run: |
          scripts/release/install-scripts.sh dist "$VERSION"
          scripts/release/manifests.sh "$VERSION" dist
          (cd dist && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS dist/
          scripts/release/gpg-sign.sh dist
          scripts/release/notes.sh "$VERSION" dist > release-notes.md
          ls -l dist
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*
            release-notes.md

      - uses: actions/attest-build-provenance@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        if: needs.prepare.outputs.publish == 'true'
        run: |
          flags=()
          [ "${{ needs.prepare.outputs.prerelease }}" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Workroam v$VERSION" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$TAG" dist/* --verify-tag --title "Workroam v$VERSION" \
              --notes-file release-notes.md "${flags[@]}"
          fi

  container:
    name: Container image
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist/container
          pattern: container-*
          merge-multiple: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          subject-name: ghcr.io/${{ github.repository }}-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  homebrew:
    name: Homebrew tap
    needs: [prepare, assemble]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'kverona-ai/homebrew-tap' }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::未配置 HOMEBREW_TAP_TOKEN，跳过更新 ${TAP_REPO}；formula 与 cask 已作为 Release 附件发布"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.token.outputs.ok == 'true'
        with:
          name: release-dist
          path: release
      - name: Push formula and cask
        if: steps.token.outputs.ok == 'true'
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula tap/Casks
          [ -f release/dist/workroam.rb ] && cp release/dist/workroam.rb tap/Formula/
          [ -f release/dist/workroam-desktop.rb ] && cp release/dist/workroam-desktop.rb tap/Casks/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula Casks
          git diff --cached --quiet && { echo "没有变化"; exit 0; }
          git commit -m "workroam $VERSION"
          git push
