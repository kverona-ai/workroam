name: Release

# 推送 v* tag 时构建全部平台的安装包并发布 GitHub Release：
#   git tag -s v0.1.0 -m "Workroam v0.1.0" && git push origin v0.1.0
# 手动运行（Actions → Release → Run workflow）：
#   tag 留空：只构建，不发布，产物在本次运行的 Artifacts 中（用于发布前演练）
#   tag 填写已存在的 tag：重新构建并发布或更新该版本
# 步骤与需要配置的 secrets 见 docs/release.md。

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（如 v0.1.0）；留空只构建不发布
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  WORKROAM_NO_BANNER: 1

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      ref: ${{ steps.meta.outputs.ref }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"; ref="refs/tags/$tag"; publish=true
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"; ref="refs/tags/$tag"; publish=true
            git rev-parse -q --verify "$ref" >/dev/null || { echo "::error::tag $tag 不存在"; exit 1; }
          else
            tag=""; ref="$GITHUB_SHA"; publish=false
          fi

          [ -f Cargo.toml ] || { echo "::error::仓库根目录没有 Cargo.toml，产品代码合入后才能发布"; exit 1; }
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "workroam-cli")][0].version // .packages[0].version')"

          if [ -n "$tag" ]; then
            version="${tag#v}"
            if [ "$version" != "$crate_version" ]; then
              echo "::error::tag $tag 与 Cargo 版本 $crate_version 不一致，请先修改 [workspace.package] version"
              exit 1
            fi
          else
            version="$crate_version"
          fi

          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "ref=$ref"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } | tee -a "$GITHUB_OUTPUT"

  binaries:
    name: CLI · ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # 命令行与后台服务；Linux 用 glibc（Ubuntu 22.04，glibc 2.35）
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, cli: true, server: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, cli: true, server: false }
          # workroam-server 在 Linux 上是 musl 静态二进制（架构 §18.1），同时产出容器镜像用的完整模式
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04, cli: false, server: true, docker: amd64 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-22.04-arm, cli: false, server: true, docker: arm64 }
          - { target: aarch64-apple-darwin, os: macos-14, cli: true, server: true }
          - { target: x86_64-apple-darwin, os: macos-14, cli: true, server: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, cli: true, server: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, cli: true, server: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libdbus-1-dev musl-tools

      - name: Build
        run: |
          bins=()
          [ "${{ matrix.cli }}" = true ] && bins+=(--bin workroam --bin workroamd)
          [ "${{ matrix.server }}" = true ] && bins+=(--bin workroam-server)
          cargo build --release --locked --target "$TARGET" "${bins[@]}"

      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host '未配置 WINDOWS_CERTIFICATE，跳过签名'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1
          $files = Get-ChildItem "target\$env:TARGET\release\*.exe" | Where-Object { $_.Name -match '^workroam(d|-server)?\.exe$' }
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $files.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $pfx

      - name: Package
        run: |
          [ "${{ matrix.cli }}" = true ] && scripts/release/package-bins.sh workroam "$VERSION" "$TARGET" dist workroam workroamd
          [ "${{ matrix.server }}" = true ] && scripts/release/package-bins.sh workroam-server "$VERSION" "$TARGET" dist workroam-server
          ls -l dist

      - name: Smoke test
        if: "!startsWith(matrix.target, 'aarch64-pc-windows') && !(runner.arch == 'ARM64' && startsWith(matrix.target, 'x86_64'))"
        run: |
          case "$TARGET" in *windows*) exe=.exe ;; *) exe= ;; esac
          dir="target/$TARGET/release"
          [ "${{ matrix.cli }}" = true ] && "$dir/workroam$exe" --version
          [ "${{ matrix.server }}" = true ] && "$dir/workroam-server$exe" --version
          true

      - name: Container binary (full mode)
        if: matrix.docker
        run: |
          has_full="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[] | select(.name == "workroam-server")][0].features | has("full")')"
          if [ "$has_full" = true ]; then
            cargo build --release --locked --target "$TARGET" --bin workroam-server --features workroam-server/full
          fi
          mkdir -p "dist-container/${{ matrix.docker }}"
          cp "target/$TARGET/release/workroam-server" "dist-container/${{ matrix.docker }}/"

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.docker
        with:
          name: container-${{ matrix.docker }}
          path: dist-container/*
          if-no-files-found: error

  desktop:
    name: Desktop · ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, arch: arm64, os: macos-14, target: aarch64-apple-darwin, bundles: 'app,dmg' }
          - { platform: macos, arch: x64, os: macos-14, target: x86_64-apple-darwin, bundles: 'app,dmg' }
          - { platform: windows, arch: x64, os: windows-latest, target: x86_64-pc-windows-msvc, bundles: 'msi,nsis' }
          # WiX 不支持 ARM64，Windows arm64 只出 NSIS 安装程序
          - { platform: windows, arch: arm64, os: windows-latest, target: aarch64-pc-windows-msvc, bundles: 'nsis' }
          - { platform: linux, arch: x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundles: 'deb,rpm,appimage' }
          - { platform: linux, arch: arm64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundles: 'deb,rpm,appimage' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      APPIMAGE_EXTRACT_AND_RUN: 1
      # src-tauri 不在根 workspace 里，统一用根目录的 target，collect-desktop.sh 从这里找安装包
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - name: Check desktop app
        run: |
          [ -f apps/desktop/src-tauri/tauri.conf.json ] || { echo "::error::没有 apps/desktop/src-tauri/tauri.conf.json"; exit 1; }
      - uses: ./.github/actions/linux-deps
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> ../../../target
      - uses: ./.github/actions/desktop-prepare
        with:
          target: ${{ matrix.target }}
          sidecars: build

      - name: Windows signing certificate
        id: wincert
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host '未配置 WINDOWS_CERTIFICATE，安装程序不签名'; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build
        working-directory: apps/desktop
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SECRET_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SECRET_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_THUMBPRINT: ${{ steps.wincert.outputs.thumbprint }}
        run: |
          # 只导出已配置的 secret：Tauri 看到空的 APPLE_CERTIFICATE 也会尝试导入证书
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="$(printenv "SECRET_$name" || true)"
            [ -n "$value" ] && export "$name=$value"
          done

          # 没有证书时：macOS 用 ad-hoc 签名（arm64 必须有签名才能运行），Windows 不签名
          override='{}'
          if [ "${{ matrix.platform }}" = macos ] && [ -z "${APPLE_CERTIFICATE:-}" ]; then
            override='{"bundle":{"macOS":{"signingIdentity":"-"}}}'
          fi
          if [ -n "$WINDOWS_THUMBPRINT" ]; then
            override="$(jq -cn --arg t "$WINDOWS_THUMBPRINT" \
              '{bundle:{windows:{certificateThumbprint:$t,digestAlgorithm:"sha256",timestampUrl:"http://timestamp.digicert.com"}}}')"
          fi
          echo "$override" > "$RUNNER_TEMP/tauri.release.json"

          npx --yes @tauri-apps/cli@^2 build \
            --target "$TARGET" \
            --bundles "${{ matrix.bundles }}" \
            --config "$RUNNER_TEMP/tauri.release.json"

      - name: Collect
        run: scripts/release/collect-desktop.sh "$VERSION" "$TARGET" "${{ matrix.platform }}" "${{ matrix.arch }}" dist

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  source:
    name: Source archives
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/release/source.sh "${{ needs.prepare.outputs.version }}" HEAD dist
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/*
          if-no-files-found: error

  assemble:
    name: Assemble release
    needs: [prepare, binaries, desktop, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '{bin,desktop}-*'
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: dist
          name: source

      - name: Install scripts, manifests, checksums
        run: |
          scripts/release/install-scripts.sh dist
          scripts/release/manifests.sh "$VERSION" dist
          (cd dist && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS dist/
          scripts/release/notes.sh "$VERSION" dist > release-notes.md
          ls -l dist
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*
            release-notes.md

      - uses: actions/attest-build-provenance@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        if: needs.prepare.outputs.publish == 'true'
        run: |
          flags=()
          [ "${{ needs.prepare.outputs.prerelease }}" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "Workroam v$VERSION" --notes-file release-notes.md "${flags[@]}"
          else
            gh release create "$TAG" dist/* --verify-tag --title "Workroam v$VERSION" \
              --notes-file release-notes.md "${flags[@]}"
          fi

  container:
    name: Container image
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          path: dist/container
          pattern: container-*
          merge-multiple: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          subject-name: ghcr.io/${{ github.repository }}-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  homebrew:
    name: Homebrew tap
    needs: [prepare, assemble]
    if: needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'kverona-ai/homebrew-tap' }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::未配置 HOMEBREW_TAP_TOKEN，跳过更新 $TAP_REPO；formula 与 cask 已作为 Release 附件发布"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.token.outputs.ok == 'true'
        with:
          name: release-dist
          path: release
      - name: Push formula and cask
        if: steps.token.outputs.ok == 'true'
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula tap/Casks
          [ -f release/dist/workroam.rb ] && cp release/dist/workroam.rb tap/Formula/
          [ -f release/dist/workroam-desktop.rb ] && cp release/dist/workroam-desktop.rb tap/Casks/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula Casks
          git diff --cached --quiet && { echo "没有变化"; exit 0; }
          git commit -m "workroam $VERSION"
          git push
