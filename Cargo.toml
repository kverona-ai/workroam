[workspace]
resolver = "2"
members = [
    "crates/workroam-core",
    "crates/workroam-platform",
    "crates/workroam-store",
    "crates/workroam-snapshot",
    "crates/workroam-lease",
    "crates/workroam-git",
    "crates/workroam-adapters",
    "crates/workroam-device",
    "crates/workroam-setup",
    "crates/workroam-engine",
    "crates/workroam-archive",
    "crates/workroam-ipc",
    "crates/workroamd",
    "crates/workroam-cli",
    "crates/workroam-server",
    "crates/workroam-web",
    "xtask",
]
default-members = [
    "crates/workroam-core",
    "crates/workroam-platform",
    "crates/workroam-store",
    "crates/workroam-snapshot",
    "crates/workroam-lease",
    "crates/workroam-git",
    "crates/workroam-adapters",
    "crates/workroam-device",
    "crates/workroam-setup",
    "crates/workroam-engine",
    "crates/workroam-archive",
    "crates/workroam-ipc",
    "crates/workroamd",
    "crates/workroam-cli",
    "crates/workroam-server",
]
exclude = ["apps/desktop/src-tauri", "apps/web/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/kverona-ai/workroam"
homepage = "https://github.com/kverona-ai/workroam"
authors = ["Workroam contributors"]

[workspace.dependencies]
workroam-core = { path = "crates/workroam-core" }
workroam-platform = { path = "crates/workroam-platform" }
workroam-store = { path = "crates/workroam-store" }
workroam-snapshot = { path = "crates/workroam-snapshot" }
workroam-lease = { path = "crates/workroam-lease" }
workroam-git = { path = "crates/workroam-git" }
workroam-adapters = { path = "crates/workroam-adapters" }
workroam-device = { path = "crates/workroam-device" }
workroam-setup = { path = "crates/workroam-setup" }
workroam-engine = { path = "crates/workroam-engine" }
workroam-archive = { path = "crates/workroam-archive" }
workroam-ipc = { path = "crates/workroam-ipc" }
workroamd = { path = "crates/workroamd" }
workroam-cli = { path = "crates/workroam-cli" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
scrypt = { version = "0.11", default-features = false }
ed25519-dalek = { version = "2", features = ["rand_core"] }
data-encoding = "2"
argon2 = "0.5"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
hex = "0.4"
dirs = "6"
tempfile = "3"
globset = "0.4"
walkdir = "2"
unicode-normalization = "0.1"
diffy = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2"] }
url = "2"
opendal = { version = "0.58", features = ["services-s3", "services-fs"] }
rustic_core = "0.13"
rustic_backend = { version = "0.7", default-features = false, features = ["opendal"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
dialoguer = { version = "0.11", default-features = false, features = ["password"] }
indicatif = "0.17"
anstream = "0.6"
anstyle = "1"
terminal_size = "0.4"
qrcode = { version = "0.14", default-features = false }
schemars = { version = "0.8", features = ["chrono"] }
notify = "8"
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
fs4 = { version = "0.13", features = ["sync"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }

# Small debug builds: the test binaries link every crate.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"

[profile.release-server]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
