[package]
name = "workroam-platform"
description = "Workroam cross-platform layer: checks, atomic writes, links, sleep inhibition, service install, keychain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
workroam-core.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-normalization.workspace = true
tracing.workspace = true
keyring.workspace = true
dirs.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[target.'cfg(windows)'.dependencies]
junction = "2"
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_Foundation", "Win32_System_Registry", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile.workspace = true
