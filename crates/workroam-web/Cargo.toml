[package]
name = "workroam-web"
description = "Workroam web reader core: unlock the repository and decrypt snapshots in the browser (WebAssembly)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
hex.workspace = true
base64.workspace = true
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
scrypt = { version = "0.12", default-features = false }
aes256ctr_poly1305aes = "0.2"
ruzstd = { version = "0.8", default-features = false, features = ["std"] }

[dev-dependencies]
workroam-core.workspace = true
workroam-snapshot.workspace = true
tempfile.workspace = true
data-encoding.workspace = true
