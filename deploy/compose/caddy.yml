# Caddy in front of everything: one domain, port 443, automatic HTTPS (DEP-02).
# The Caddyfile is generated by install.sh from deploy/caddy/Caddyfile.
services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.10}
    restart: unless-stopped
    environment:
      WORKROAM_SITE: ${WORKROAM_SITE}
      STORAGE_UPSTREAM: ${STORAGE_UPSTREAM}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - storage

volumes:
  caddy-data:
  caddy-config:
