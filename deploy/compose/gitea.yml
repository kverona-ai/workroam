# Gitea at https://<domain>/git/ as the transfer repository for `remote`
# mode git repos (PRD DEP-04). SQLite, no SSH: clone over HTTPS.
services:
  gitea:
    image: ${GITEA_IMAGE:-gitea/gitea:1.24}
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: ${WORKROAM_DOMAIN}
      GITEA__server__ROOT_URL: ${WORKROAM_PUBLIC_URL}/git/
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__security__INSTALL_LOCK: "true"
    volumes:
      - gitea-data:/data

volumes:
  gitea-data:
