{{- if not .Values.storage.existingSecret }}
{{- $name := printf "%s-storage" (include "workroam.fullname" .) }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $ak := .Values.storage.accessKey }}
{{- $sk := .Values.storage.secretKey }}
{{- if and (not $ak) $old }}{{ $ak = index $old.data "access-key" | b64dec }}{{ end }}
{{- if and (not $sk) $old }}{{ $sk = index $old.data "secret-key" | b64dec }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "workroam.labels" . | nindent 4 }}
type: Opaque
data:
  access-key: {{ $ak | default (printf "WR%s" (randAlphaNum 18 | upper)) | b64enc | quote }}
  secret-key: {{ $sk | default (randAlphaNum 40) | b64enc | quote }}
{{- end }}
