<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Workroam logo">
  <!--
    Workroam app icon (Liquid Glass).
    W-shaped route: office device -> storage -> home device.
    The two rings are devices, the amber orb is your workspace,
    which travels along the route and is written on one machine at a time.
  -->
  <defs>
    <linearGradient id="wr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.55" stop-color="#1FB6E8"/>
      <stop offset="1" stop-color="#2ED3B7"/>
    </linearGradient>
    <radialGradient id="wr-sheen" cx="0.28" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wr-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#0B2A6B" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B2A6B" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="wr-route" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF3FF" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="wr-orb" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFF1CC"/>
      <stop offset="0.45" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF7A2F"/>
    </radialGradient>
    <filter id="wr-lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0B2A6B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="38" fill="url(#wr-bg)"/>
  <rect x="4" y="4" width="152" height="152" rx="38" fill="url(#wr-floor)"/>
  <rect x="4" y="4" width="152" height="152" rx="38" fill="url(#wr-sheen)"/>
  <rect x="5" y="5" width="150" height="150" rx="37" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5"/>
  <g filter="url(#wr-lift)">
    <path d="M38 52 L59 110 L80 68 L101 110 L122 52" fill="none" stroke="url(#wr-route)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="52" r="11" fill="#FFFFFF"/>
    <circle cx="38" cy="52" r="4.5" fill="#2F6BFF"/>
    <circle cx="122" cy="52" r="11" fill="#FFFFFF"/>
    <circle cx="122" cy="52" r="4.5" fill="#2ED3B7"/>
    <circle cx="80" cy="66" r="12" fill="url(#wr-orb)"/>
    <ellipse cx="76" cy="61.5" rx="4.5" ry="3" fill="#FFFFFF" fill-opacity="0.75"/>
  </g>
</svg>
