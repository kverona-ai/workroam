<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Project logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5A4"/>
    </linearGradient>
    <linearGradient id="workroam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="36" fill="url(#bg)"/>
  <!-- relay arcs: two machines handing over -->
  <path d="M42 62 A44 44 0 0 1 112 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <path d="M106 30 L118 40 L104 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M118 98 A44 44 0 0 1 48 120" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round"/>
  <path d="M54 130 L42 120 L56 112" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the workroam -->
  <g transform="rotate(-35 80 80)">
    <rect x="34" y="68" width="92" height="24" rx="12" fill="url(#workroam)"/>
    <rect x="60" y="68" width="8" height="24" fill="#4F46E5" fill-opacity="0.85"/>
    <rect x="92" y="68" width="8" height="24" fill="#0EA5A4" fill-opacity="0.85"/>
  </g>
</svg>
